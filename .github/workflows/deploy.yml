name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_sync:
        description: Re-process all project images (ignore cache)
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.filter.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            projects:
              - 'Projects/**'
              - 'scripts/sync-projects.mjs'

  build:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Restore synced project assets
        id: projects-cache
        uses: actions/cache@v4
        with:
          path: |
            public/projects
            src/data/projects.manifest.json
          key: project-assets-${{ hashFiles('Projects/**', 'scripts/sync-projects.mjs') }}

      - name: Sync project images
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.force_sync == true) ||
          (github.event_name == 'push' && needs.changes.outputs.projects == 'true') ||
          steps.projects-cache.outputs.cache-hit != 'true'
        run: npm run sync:projects

      - name: Build site
        run: npm run build:app

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
